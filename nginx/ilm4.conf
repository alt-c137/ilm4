# Nginx ilm4: статика/медиа с volume, остальное — прокси в gunicorn.
# За Cloudflare (когда подключим) — этот же конфиг принимает X-Forwarded-Proto.

upstream ilm4_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;   # лимит загрузки файлов (валидация в Django тоже есть)

    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://ilm4_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
