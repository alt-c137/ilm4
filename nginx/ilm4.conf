# Nginx ilm4: статика/медиа с volume, WebSocket и страницы — в daphne (ASGI).
# За Cloudflare (когда подключим) — этот же конфиг принимает X-Forwarded-Proto.

upstream ilm4_app {
    server app:8000;
    keepalive 32;            # nginx держит готовые соединения с приложением — не открывает новое на каждый запрос
}

# Сжатие текста (страницы, JSON, CSS, JS): в 4–6 раз меньше трафика, быстрее на мобильной сети
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml text/xml application/xml;

# Защита от «завала» запросами с одного адреса: в среднем 25 запросов в секунду, всплеск до 80.
# Обычному человеку этого хватает с запасом; бот, который долбит сайт, получает 429 и не мешает остальным.
limit_req_zone $binary_remote_addr zone=ilm4_req:20m rate=25r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# За Cloudflare nginx получает http, а браузер открыл https: берём протокол от
# Cloudflare, иначе Django (SECURE_SSL=True) уйдёт в бесконечный редирект на https.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Настоящий IP посетителя за Cloudflare (для журнала, лимита запросов и лимита попыток входа).
# Заголовку CF-Connecting-IP верим ТОЛЬКО когда запрос пришёл с адресов самого Cloudflare: иначе любой мог бы
# вписать в него выдуманный адрес и обойти все ограничения «по IP» (подбор пароля, регистрации, лимит запросов).
# Запрос пришёл напрямую — берём адрес соединения, заголовок игнорируем.
# Список адресов Cloudflare: https://www.cloudflare.com/ips/ (меняется редко; сверять при подключении Cloudflare).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name _;

    # Обычная загрузка — до 100 МБ одним запросом. Большие файлы (до 2 ГБ) идут частями по 4 МБ
    # (apps/chat/services.py: upload_*), поэтому поднимать этот предел не нужно.
    client_max_body_size 110M;
    client_body_timeout 120s;
    send_timeout 120s;

    # Статика с отпечатком содержимого в имени (base.3f2a9c1d8e7b.css — так их называет collectstatic):
    # файл с таким именем никогда не меняется, браузер может хранить его год и не переспрашивать.
    location ~* "^/static/(.+\.[0-9a-f]{12}\.[a-z0-9]+)$" {
        alias /staticfiles/$1;
        access_log off;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # Остальная статика (без отпечатка в имени) — месяц
    location /static/ {
        alias /staticfiles/;
        access_log off;
        gzip_static on;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        open_file_cache max=2000 inactive=60s;
        open_file_cache_valid 120s;
    }

    # вложения чата — только через проверку участника в Django (X-Accel-Redirect)
    location /media/chat/ {
        deny all;
    }
    # файлы книг (платные) — только через Django: оплачено/бесплатно
    location /media/books/files/ {
        deny all;
    }
    # фото анкет никяха (зашифрованы) — только через показ по взаимной симпатии
    location /media/nikah_private/ {
        deny all;
    }
    location /protected-media/ {
        internal;
        alias /media/;
    }

    # Загрузки пользователей: только как картинки/файлы, никаких скриптов и HTML
    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # WebSocket: чат, «прочитано», звонки (сигналинг)
    location /ws/ {
        proxy_pass http://ilm4_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # только проверенный адрес, без присланного посетителем
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 3600s;
    }

    location / {
        limit_req zone=ilm4_req burst=80 nodelay;
        proxy_pass http://ilm4_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # нужно для keepalive к приложению
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;                 # большие файлы скачиваются долго
        proxy_buffering on;
        proxy_request_buffering off;             # части больших файлов идут в приложение сразу, без записи на диск nginx
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # только проверенный адрес, без присланного посетителем
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
