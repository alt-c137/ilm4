# Nginx ilm4: статика/медиа с volume, WebSocket и страницы — в daphne (ASGI).
# За Cloudflare (когда подключим) — этот же конфиг принимает X-Forwarded-Proto.

upstream ilm4_app {
    server app:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30M;   # фото 10 МБ, видеокружки до 25 МБ (валидация в Django тоже есть)

    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
    }

    # вложения чата — только через проверку участника в Django (X-Accel-Redirect)
    location /media/chat/ {
        deny all;
    }
    location /protected-media/ {
        internal;
        alias /media/;
    }

    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
    }

    # WebSocket: чат, «прочитано», звонки (сигналинг)
    location /ws/ {
        proxy_pass http://ilm4_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://ilm4_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
