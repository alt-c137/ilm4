# Nginx ilm4: статика/медиа с volume, WebSocket и страницы — в daphne (ASGI).
# За Cloudflare (когда подключим) — этот же конфиг принимает X-Forwarded-Proto.

upstream ilm4_app {
    server app:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# За Cloudflare nginx получает http, а браузер открыл https: берём протокол от
# Cloudflare, иначе Django (SECURE_SSL=True) уйдёт в бесконечный редирект на https.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Настоящий IP посетителя за Cloudflare (для журнала и лимита попыток входа)
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30M;   # фото 10 МБ, видеокружки до 25 МБ (валидация в Django тоже есть)

    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
    }

    # вложения чата — только через проверку участника в Django (X-Accel-Redirect)
    location /media/chat/ {
        deny all;
    }
    # файлы книг (платные) — только через Django: оплачено/бесплатно
    location /media/books/files/ {
        deny all;
    }
    location /protected-media/ {
        internal;
        alias /media/;
    }

    # Загрузки пользователей: только как картинки/файлы, никаких скриптов и HTML
    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # WebSocket: чат, «прочитано», звонки (сигналинг)
    location /ws/ {
        proxy_pass http://ilm4_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://ilm4_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
