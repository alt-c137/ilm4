{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% translate "Новый диалог —" %} {{ block.super }}{% endblock %}

{% block content %}
<div class="page">
  <h1>{% translate "Новый диалог" %}</h1>
  <form method="post" class="form">{% csrf_token %}
    <label>{% translate "Email участника" %}</label>
    <input type="email" name="email" value="{{ email }}" required>
    <label>{% translate "Тема (необязательно)" %}</label>
    <input type="text" name="subject" maxlength="160" placeholder="{% translate 'например: iPhone 14 Pro' %}">
    <button type="submit" class="btn btn--p">{% translate "Начать диалог" %}</button>
  </form>
</div>
{% endblock %}
