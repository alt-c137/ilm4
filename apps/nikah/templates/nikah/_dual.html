<div class="nkdual">
  <div class="nkdual__head"><span>{{ label }}</span><b>от <i data-a></i> до <i data-b></i>{% if unit %} <small>{{ unit }}</small>{% endif %}</b></div>
  <div class="nkdual__track"><div class="nkdual__fill"></div>
    <input type="range" name="{{ name }}_min" min="{{ lo }}" max="{{ hi }}" step="{{ step|default:1 }}" value="{{ a|default:lo }}" aria-label="{{ label }} от">
    <input type="range" name="{{ name }}_max" min="{{ lo }}" max="{{ hi }}" step="{{ step|default:1 }}" value="{{ b|default:hi }}" aria-label="{{ label }} до">
  </div>
  <div class="nkdual__scale"><span>{{ lo }}</span><span class="nkdual__tip">← тяните кружки →</span><span>{{ hi }}</span></div>
</div>
