{% load news_tags %}{% load humanize %}{% recent_news 10 as recent %}
{% if recent %}
<section class="sec">
  <div class="sec__h">
    <div class="sec__t">Новости</div>
    <a class="sec__l" href="/news/">Все новости →</a>
  </div>
  <div class="newsline-grid">
    {% for p in recent %}
    <a class="newsline" href="/news/{{ p.slug }}/">
      {% if p.cover %}
      <span class="newsline__thumb"><img src="{{ p.cover.url }}" alt="" loading="lazy"></span>
      {% else %}
      <span class="newsline__thumb newsline__thumb--{% cycle 'a' 'b' 'c' %}">📰</span>
      {% endif %}
      <span class="newsline__body">
        <span class="newsline__t">{{ p.title }}</span>
        <span class="newsline__m">{{ p.created_at|naturaltime }}</span>
      </span>
    </a>
    {% endfor %}
  </div>
</section>
{% endif %}
