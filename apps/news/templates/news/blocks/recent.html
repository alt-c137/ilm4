{% load news_tags %}{% recent_news 6 as recent %}
{% if recent %}
<section class="sec">
  <div class="sec__h">
    <div class="sec__t">Новости</div>
    <a class="sec__l" href="/news/">Все новости →</a>
  </div>
  <div class="rail">
    {% for p in recent %}
    <a class="card rcard--news" href="/news/{{ p.slug }}/">
      <div class="ncard__cover ncard__cover--{% cycle 'a' 'b' 'c' %}">
        {% if p.cover %}<img src="{{ p.cover.url }}" alt="">{% else %}📰{% endif %}
      </div>
      <div class="card__b">
        <div class="card__t">{{ p.title }}</div>
        <div class="card__f"><span class="meta">{{ p.created_at|date:"d.m H:i" }}</span></div>
      </div>
    </a>
    {% endfor %}
  </div>
</section>
{% endif %}
