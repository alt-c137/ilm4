<section class="sec" id="modules">
  <div class="sec__h"><div class="sec__t">Разделы платформы</div></div>
  <div class="cats">
    {% for m in modules %}
    <a class="cat{% if m.status == 'soon' %} soon{% endif %}"
       href="{% if m.status == 'on' %}/{{ m.key }}/{% else %}{% url 'core:soon' %}?m={{ m.key }}{% endif %}">
      <div class="cat__i">{{ m.icon }}</div>
      <div class="cat__n">{{ m.name }}</div>
      <div class="cat__c">{% if m.status == 'on' %}открыт{% else %}скоро{% endif %}</div>
    </a>
    {% endfor %}
  </div>
</section>
