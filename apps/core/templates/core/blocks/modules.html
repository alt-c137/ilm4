{% load icons %}
<section class="sec" id="modules">
  <div class="railnav">
  <div class="apps">
    {% for m in modules %}
    <a class="app{% if m.status == 'soon' %} soon{% endif %}"
       href="{% if m.status == 'on' %}/{{ m.key }}/{% else %}{% url 'core:soon' %}?m={{ m.key }}{% endif %}">
      <div class="app__wrap app--{{ m.key }}">{% svc_icon m.key m.icon 'app__ic' %}</div>
      <div class="app__n">{{ m.name }}</div>
      {% if m.status == 'soon' %}<div class="app__soon">скоро</div>{% endif %}
    </a>
    {% endfor %}
    <a class="app app--more hide-d" href="{% url 'core:soon' %}">
      <div class="app__wrap"><div class="app__ic"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></div></div>
      <div class="app__n">Скоро ещё</div>
    </a>
  </div>
  <button type="button" class="rail-arrow l" aria-label="Назад">‹</button>
  <button type="button" class="rail-arrow r" aria-label="Вперёд">›</button>
  </div>
</section>
