{% load i18n %}{% get_current_language as CUR %}
{# язык в шапке: кнопка с кодом языка + своё выпадающее меню (без системного select) #}
<div class="langm" id="langm">
  <button type="button" class="langm__btn" id="langm-btn" aria-haspopup="true" aria-expanded="false" aria-label="{% translate 'Язык' %}" title="{% translate 'Язык' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.1 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.1-3.6-8.5s1.2-6.2 3.6-8.5z"/></svg>
    <span>{{ CUR|upper }}</span>
  </button>
  <form method="post" action="{% url 'core:set_lang' %}" class="langm__pop" role="menu">{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <div class="langm__t">{% translate "Язык" %}</div>
    {% for code, name in lang_choices %}
    <button type="submit" name="language" value="{{ code }}" role="menuitemradio" aria-checked="{% if code == CUR %}true{% else %}false{% endif %}" class="langm__o{% if code == CUR %} on{% endif %}" lang="{{ code }}">
      <span class="langm__c">{{ code|upper }}</span><span class="langm__n">{{ name }}</span>
      {% if code == CUR %}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>{% endif %}
    </button>
    {% endfor %}
  </form>
</div>
